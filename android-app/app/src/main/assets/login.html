<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Giriş - 1.5 Adana Elektromobil Telemetri</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/favicon.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .logo-section .logos img {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            transition: all 0.3s ease;
        }

        .logo-section .logos img:hover {
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6)) drop-shadow(0 0 40px rgba(16, 185, 129, 0.4));
            transform: scale(1.05);
        }

        .logo-section h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo-section p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-wrapper input {
            width: 100%;
            padding: 14px 44px 14px 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-wrapper input::placeholder {
            color: #475569;
        }

        /* Password Toggle Button */
        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #3b82f6;
        }

        /* Role Selection */
        .role-selection {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }

        .role-option {
            flex: 1;
            position: relative;
        }

        .role-option input {
            position: absolute;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }

        .role-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-option label i {
            font-size: 1.5rem;
            margin-bottom: 8px;
            color: #64748b;
            transition: color 0.3s;
        }

        .role-option label span {
            font-size: 0.85rem;
            font-weight: 500;
            color: #94a3b8;
            transition: color 0.3s;
        }

        .role-option input:checked+label {
            border-color: #3b82f6;
            background: rgba(59, 130, 246, 0.1);
        }

        .role-option input:checked+label i {
            color: #3b82f6;
        }

        .role-option input:checked+label span {
            color: #f1f5f9;
        }

        .role-option:first-child input:checked+label {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }

        .role-option:first-child input:checked+label i {
            color: #10b981;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .login-btn.loading span,
        .login-btn.loading i.fa-arrow-right {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 0.8rem;
        }

        .footer-text a {
            color: #3b82f6;
            text-decoration: none;
        }

        /* ==================== SUCCESS ANIMATION ==================== */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }

        .success-overlay.show {
            display: flex;
            animation: successFadeIn 0.3s ease-out;
        }

        @keyframes successFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .success-logo {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            animation: logoPulse 1.5s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .success-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }

        .success-loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .success-loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #3b82f6, #10b981, transparent);
            animation: loadingSlide 1.2s ease-in-out infinite;
        }

        @keyframes loadingSlide {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .success-status {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Mobile responsive */
        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }

            .logo-section h1 {
                font-size: 1.25rem;
            }

            .role-selection {
                flex-direction: column;
            }

            .success-logo {
                width: 100px;
            }

            .success-text {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- Success Animation Overlay -->
    <div class="success-overlay" id="success-overlay">
        <img src="img/logo_white.png" alt="1.5 Adana" class="success-logo">
        <div class="success-text">1.5 ADANA</div>
        <div class="success-loader"></div>
        <div class="success-status">Dashboard'a yönlendiriliyorsunuz...</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logos">
                    <img src="img/logo_white.png" alt="1.5 Adana Logo">
                    <img src="img/logo_c.png" alt="Çukurova Logo">
                </div>
                <h1>1.5 ADANA</h1>
                <p>Elektromobil Telemetri Sistemi</p>
            </div>

            <form id="login-form">
                <div class="error-message" id="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="error-text">Hata oluştu</span>
                </div>

                <div class="form-group">
                    <label for="username">Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="username" name="username" placeholder="Kullanıcı adınızı girin" required
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" name="password" placeholder="Şifrenizi girin" required
                            autocomplete="current-password">
                        <button type="button" class="password-toggle" id="password-toggle" onclick="togglePassword()">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Giriş Türü</label>
                    <div class="role-selection">
                        <div class="role-option">
                            <input type="radio" name="role" id="role-member" value="member" checked>
                            <label for="role-member">
                                <i class="fa-solid fa-user"></i>
                                <span>Üye</span>
                            </label>
                        </div>
                        <div class="role-option">
                            <input type="radio" name="role" id="role-admin" value="admin">
                            <label for="role-admin">
                                <i class="fa-solid fa-user-shield"></i>
                                <span>Admin</span>
                            </label>
                        </div>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <div class="spinner"></div>
                    <span>Giriş Yap</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>
            </form>

            <p class="footer-text">
                © 2026 <span onclick="openLinkedIn()" style="cursor:pointer; text-decoration:underline;">Ali Enes Akalın</span> - Çukurova
                Üniversitesi
            </p>
        </div>
    </div>

    <script>
        // LinkedIn'i native uygulamada, yoksa tarayıcıda aç
        function openLinkedIn() {
            const profileUrl = 'https://www.linkedin.com/in/aliakalin/';
            const isAndroidWebView = !!window.AndroidNotification;
            if (isAndroidWebView) {
                const intent = 'intent://www.linkedin.com/in/aliakalin/#Intent;scheme=https;package=com.linkedin.android;S.browser_fallback_url=' + encodeURIComponent(profileUrl) + ';end';
                window.location.href = intent;
            } else {
                window.open(profileUrl, '_blank');
            }
        }

        // Check if already logged in
        const token = localStorage.getItem('authToken');
        if (token) {
            window.location.href = 'index.html';
        }

        const form = document.getElementById('login-form');
        const loginBtn = document.getElementById('login-btn');
        const errorMessage = document.getElementById('error-message');
        const errorText = document.getElementById('error-text');
        const successOverlay = document.getElementById('success-overlay');
        
        // API Base URL - Android ve Web uyumlu
        const API_BASE = window.location.protocol === 'file:' 
            ? 'https://telemetry-aliakalin.com.tr' 
            : '';

        // Password Toggle Function
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('password-toggle');
            const icon = toggleBtn.querySelector('i');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const role = document.querySelector('input[name="role"]:checked').value;

            // Hide previous error
            errorMessage.classList.remove('show');

            // Show loading
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Giriş başarısız');
                }

                // Check if user role matches selected role
                if (data.user.role !== role) {
                    throw new Error(`Bu hesap ${role === 'admin' ? 'admin' : 'üye'} hesabı değil`);
                }

                // Save auth data
                localStorage.setItem('authToken', data.token);
                if (data.refreshToken) localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Show success animation
                successOverlay.classList.add('show');

                // Wait for animation then redirect
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (err) {
                errorText.textContent = err.message;
                errorMessage.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
