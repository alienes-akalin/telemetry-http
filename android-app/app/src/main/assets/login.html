<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#3b82f6">
    <title>Giriş - 1.5 Adana Elektromobil Telemetri</title>

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Orbitron:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="img/favicon.png" type="image/png">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #020617;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.15) 0%, transparent 25%),
                radial-gradient(circle at 50% 50%, rgba(139, 92, 246, 0.1) 0%, transparent 50%);
            padding: 20px;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-card {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo-section {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo-section .logos {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 24px;
        }

        .logo-section .logos img {
            width: 110px;
            height: auto;
            filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.3));
            transition: all 0.3s ease;
        }

        .logo-section .logos img:hover {
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.6)) drop-shadow(0 0 40px rgba(16, 185, 129, 0.4));
            transform: scale(1.05);
        }

        .logo-section h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .logo-section p {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            background: linear-gradient(135deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
            font-size: 1rem;
            transition: color 0.3s;
            pointer-events: none;
        }

        .input-wrapper input,
        .input-wrapper select {
            width: 100%;
            padding: 14px 44px 14px 44px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #f1f5f9;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-wrapper select {
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
        }

        .input-wrapper input:focus,
        .input-wrapper select:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }

        .input-wrapper input::placeholder {
            color: #475569;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 4px;
            font-size: 1rem;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #3b82f6;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #2563eb);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(59, 130, 246, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .login-btn .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .login-btn.loading .spinner {
            display: block;
        }

        .login-btn.loading span,
        .login-btn.loading i.fa-arrow-right {
            display: none;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #fca5a5;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .error-message.show {
            display: flex;
        }

        .success-message {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 20px;
            color: #6ee7b7;
            font-size: 0.85rem;
            display: none;
            align-items: center;
            gap: 8px;
        }

        .success-message.show {
            display: flex;
        }

        .toggle-link {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .toggle-link a {
            color: #3b82f6;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .toggle-link a:hover {
            text-decoration: underline;
        }

        .footer-text {
            text-align: center;
            margin-top: 24px;
            color: #64748b;
            font-size: 0.8rem;
        }

        .footer-text a {
            color: #3b82f6;
            text-decoration: none;
        }

        /* Success Overlay */
        .success-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #020617;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 9999;
        }

        .success-overlay.show {
            display: flex;
            animation: successFadeIn 0.3s ease-out;
        }

        @keyframes successFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .success-logo {
            width: 120px;
            height: auto;
            margin-bottom: 24px;
            animation: logoPulse 1.5s ease-in-out infinite;
        }

        @keyframes logoPulse {

            0%,
            100% {
                transform: scale(1);
                opacity: 1;
            }

            50% {
                transform: scale(1.05);
                opacity: 0.8;
            }
        }

        .success-text {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #3b82f6, #10b981);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 32px;
        }

        .success-loader {
            width: 200px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .success-loader::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, #3b82f6, #10b981, transparent);
            animation: loadingSlide 1.2s ease-in-out infinite;
        }

        @keyframes loadingSlide {
            0% {
                left: -100%;
            }

            100% {
                left: 100%;
            }
        }

        .success-status {
            margin-top: 16px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        /* Hidden form */
        .form-hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 24px;
            }

            .logo-section h1 {
                font-size: 1.25rem;
            }

            .success-logo {
                width: 100px;
            }

            .success-text {
                font-size: 1.25rem;
            }
        }
    </style>
</head>

<body>
    <!-- Success Animation Overlay -->
    <div class="success-overlay" id="success-overlay">
        <img src="img/logo_white.png" alt="1.5 Adana" class="success-logo">
        <div class="success-text">1.5 ADANA</div>
        <div class="success-loader"></div>
        <div class="success-status">Dashboard'a yönlendiriliyorsunuz...</div>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="logo-section">
                <div class="logos">
                    <img src="img/logo_white.png" alt="1.5 Adana Logo">
                    <img src="img/logo_c.png" alt="Çukurova Logo">
                </div>
                <h1>1.5 ADANA</h1>
                <p>Elektromobil Telemetri Sistemi</p>
            </div>

            <!-- ==================== GİRİŞ FORMU ==================== -->
            <form id="login-form">
                <div class="error-message" id="login-error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="login-error-text">Hata oluştu</span>
                </div>

                <div class="form-group">
                    <label for="login-username">Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="login-username" placeholder="Kullanıcı adınızı girin" required
                            autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="login-password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="login-password" placeholder="Şifrenizi girin" required
                            autocomplete="current-password">
                        <button type="button" class="password-toggle" onclick="togglePassword('login-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="login-btn">
                    <div class="spinner"></div>
                    <span>Giriş Yap</span>
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="toggle-link">
                    Hesabınız yok mu? <a onclick="showRegister()">Kayıt Ol</a>
                </div>
            </form>

            <!-- ==================== KAYIT FORMU ==================== -->
            <form id="register-form" class="form-hidden">
                <div class="error-message" id="register-error">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="register-error-text">Hata oluştu</span>
                </div>

                <div class="success-message" id="register-success">
                    <i class="fa-solid fa-circle-check"></i>
                    <span id="register-success-text">Kayıt talebiniz oluşturuldu</span>
                </div>

                <div class="form-group">
                    <label for="reg-username">Kullanıcı Adı</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="reg-username" placeholder="Kullanıcı adı (3-20 karakter)" required
                            minlength="3" maxlength="20">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password">Şifre</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password" placeholder="Şifre (min 6 karakter)" required
                            minlength="6">
                        <button type="button" class="password-toggle" onclick="togglePassword('reg-password', this)">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-password2">Şifre Tekrar</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="reg-password2" placeholder="Şifreyi tekrar girin" required
                            minlength="6">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-role">İstenilen Rütbe</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-shield-halved input-icon"></i>
                        <select id="reg-role">
                            <option value="member">Üye (Member)</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>

                <button type="submit" class="login-btn" id="register-btn"
                    style="background: linear-gradient(135deg, #10b981, #059669);">
                    <div class="spinner"></div>
                    <span>Kayıt Talebi Gönder</span>
                    <i class="fa-solid fa-paper-plane"></i>
                </button>

                <div class="toggle-link">
                    Zaten hesabınız var mı? <a onclick="showLogin()">Giriş Yap</a>
                </div>
            </form>

            <p class="footer-text">
                © 2026 <span onclick="openLinkedIn()" style="cursor:pointer; text-decoration:underline;">Ali Enes
                    Akalın</span> - Çukurova
                Üniversitesi
            </p>
        </div>
    </div>

    <script>
        // LinkedIn handler
        function openLinkedIn() {
            const profileUrl = 'https://www.linkedin.com/in/aliakalin/';
            const isAndroidWebView = !!window.AndroidNotification;
            if (isAndroidWebView) {
                const intent = 'intent://www.linkedin.com/in/aliakalin/#Intent;scheme=https;package=com.linkedin.android;S.browser_fallback_url=' + encodeURIComponent(profileUrl) + ';end';
                window.location.href = intent;
            } else {
                window.open(profileUrl, '_blank');
            }
        }

        // Already logged in check
        const token = localStorage.getItem('authToken');
        if (token) {
            window.location.href = 'index.html';
        }

        // API Base URL
        const API_BASE = window.location.protocol === 'file:'
            ? 'https://telemetry-aliakalin.com.tr'
            : '';

        // Form references
        const loginForm = document.getElementById('login-form');
        const registerForm = document.getElementById('register-form');

        // Toggle between login and register
        function showRegister() {
            loginForm.classList.add('form-hidden');
            registerForm.classList.remove('form-hidden');
            document.getElementById('register-error').classList.remove('show');
            document.getElementById('register-success').classList.remove('show');
        }

        function showLogin() {
            registerForm.classList.add('form-hidden');
            loginForm.classList.remove('form-hidden');
            document.getElementById('login-error').classList.remove('show');
        }

        // Password toggle
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        // ==================== LOGIN ====================
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;
            const loginBtn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');
            const errorText = document.getElementById('login-error-text');

            errorEl.classList.remove('show');
            loginBtn.classList.add('loading');
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Giriş başarısız');
                }

                // Save auth data
                localStorage.setItem('authToken', data.token);
                if (data.refreshToken) localStorage.setItem('refreshToken', data.refreshToken);
                localStorage.setItem('user', JSON.stringify(data.user));

                // Show success animation
                document.getElementById('success-overlay').classList.add('show');

                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);

            } catch (err) {
                errorText.textContent = err.message;
                errorEl.classList.add('show');
                loginBtn.classList.remove('loading');
                loginBtn.disabled = false;
            }
        });

        // ==================== REGISTER ====================
        registerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value;
            const passwordConfirm = document.getElementById('reg-password2').value;
            const requestedRole = document.getElementById('reg-role').value;
            const registerBtn = document.getElementById('register-btn');
            const errorEl = document.getElementById('register-error');
            const errorText = document.getElementById('register-error-text');
            const successEl = document.getElementById('register-success');
            const successText = document.getElementById('register-success-text');

            errorEl.classList.remove('show');
            successEl.classList.remove('show');

            // Client-side validation
            if (password !== passwordConfirm) {
                errorText.textContent = 'Şifreler eşleşmiyor';
                errorEl.classList.add('show');
                return;
            }

            registerBtn.classList.add('loading');
            registerBtn.disabled = true;

            try {
                const response = await fetch(`${API_BASE}/api/auth/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, passwordConfirm, requestedRole })
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'Kayıt başarısız');
                }

                // Show success
                successText.textContent = 'Kayıt talebiniz oluşturuldu! Süperadmin onayı bekleniyor.';
                successEl.classList.add('show');

                // Reset form
                registerForm.reset();

                // 3 saniye sonra login formuna geç
                setTimeout(() => showLogin(), 4000);

            } catch (err) {
                errorText.textContent = err.message;
                errorEl.classList.add('show');
            } finally {
                registerBtn.classList.remove('loading');
                registerBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
